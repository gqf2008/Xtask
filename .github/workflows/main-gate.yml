name: main-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + 目标
        # pin 到本地开发 nightly(2025-08-08):最新 nightly 的 core::num trait
        # 演进会使旧 x86_64 crate 编译失败(E0046)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-08
          # 内核门禁目标集:riscv32imac(gd32/qemu 示例全链);host 回归用宿主
          # 工具链自带目标;R5 门禁独立在 r52.yml(armv7r)
          targets: riscv32imac-unknown-none-elf

      - name: 安装 QEMU(riscv32)
        run: |
          # runner 可能自带 qemu-system-riscv32;没有则 apt 尽力安装
          # (qemu-system-misc 的 postinst 在容器里调 systemctl 会失败,
          # 但包本身装好——以二进制存在性为判据)
          if ! command -v qemu-system-riscv32 >/dev/null 2>&1; then
            echo "runner 无 qemu-system-riscv32,尝试 apt 安装"
            sudo apt-get update 2>&1 | tail -3 || echo "(apt update 非零,用现有索引继续)"
            sudo NEEDRESTART_SUSPEND=1 apt-get install -y --no-install-recommends \
              qemu-system-misc 2>&1 | tail -3 || echo "(apt install 非零——postinst systemctl 在容器内失败,检查二进制)"
          fi
          command -v qemu-system-riscv32 || { echo "qemu-system-riscv32 不可用" >&2; exit 1; }
          qemu-system-riscv32 --version | head -1

      - name: 内核门禁(ci/gate.sh:host 回归 + 示例链接 + QEMU 执行)
        run: bash ci/gate.sh
