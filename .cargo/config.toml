[env]

[build]
# target = "thumbv7m-none-eabi"
target = "thumbv7em-none-eabihf"
# target = "riscv32imac-unknown-none-elf"
# target = "thumbv6m-none-eabi"

[target.riscv32imc-unknown-none-elf]
rustflags = [
  "-Clink-arg=-Tmemory.x",
  "-Clink-arg=-Tlink.x",
]

[target.riscv32imac-unknown-none-elf]
runner = 'D:\\NucleiStudio\\toolchain\\gcc\\bin\\riscv-nuclei-elf-gdb.exe -x openocd.gdb'
rustflags = [
  "-Clink-arg=-Tmemory.x",
  "-Clink-arg=-Tlink.x",
]

[target.thumbv7em-none-eabihf]
# runner = 'probe-run --chip  STM32F427VITx'
# runner = 'probe-run --chip  STM32H7B0VBTx'
runner = 'probe-run --chip  STM32F411CEUx'
#runner = "/Volumes/gqf/toolchain/gcc-arm-none-eabi-10-2020-q4-major/bin/arm-none-eabi-gdb -q -x openocd.gdb"
# runner = "D:\\toolchain\\arm\\bin\\arm-none-eabi-gdb -q -x openocd.gdb"
rustflags = [
  # "-Clink-arg=-Tmemory.x",
  "-Clink-arg=-Tlink.x",
]

[target.thumbv7m-none-eabi]
runner = "/Volumes/gqf/toolchain/gcc-arm-none-eabi-10-2020-q4-major/bin/arm-none-eabi-gdb -q -x openocd.gdb"
# runner = "D:\\toolchain\\arm\\bin\\arm-none-eabi-gdb -q -x openocd.gdb"
rustflags = [
  # "-Clink-arg=-Tmemory.x",
  "-Clink-arg=-Tlink.x",
]

[target.thumbv6m-none-eabi]
runner = "elf2uf2-rs -d"
# runner = "probe-run --chip RP2040"
rustflags = [
  "-Clink-arg=--nmagic",
  "-Clink-arg=-Tlink.x",
  "-Cinline-threshold=5",
  "-Cno-vectorize-loops",
]

# Cortex-R5(QEMU zcu102):自备链接脚本(memory.x + link.x,无 runtime crate)。
# 不加 runner——QEMU 由 check.sh / 手动命令跑,见 book/src/ch29-*.md
# +vfp3:开 FPU 指令集(帧含 VFP 块 D0-D15+FPSCR,见第 30 章「FPU 帧」;不加 d32
# 即 D16,与 R5F 的 VFPv3-D16 一致);float ABI 仍是 soft(参数走通用
# 寄存器),函数体可用 VFP 指令
[target.armv7r-none-eabi]
rustflags = [
  "-Clink-arg=-Tmemory.x",
  "-Clink-arg=-Tlink.x",
  "-Ctarget-feature=+vfp3",
]
