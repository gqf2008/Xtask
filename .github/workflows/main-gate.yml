name: main-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + 目标
        uses: dtolnay/rust-toolchain@nightly
        with:
          # checkpoint 目标集:riscv32imac(gd32/qemu 全链) + thumbv7em(ch16
          # checkpoint);host 测试与 [3/5] 示例链接共用 riscv32imac
          targets: riscv32imac-unknown-none-elf, thumbv7em-none-eabihf

      - name: 安装 QEMU(riscv32)与 mdbook
        run: |
          # runner 可能自带 qemu-system-riscv32;没有则 apt 尽力安装
          # (qemu-system-misc 的 postinst 在容器里调 systemctl 会失败,
          # 但包本身装好——以二进制存在性为判据)
          if ! command -v qemu-system-riscv32 >/dev/null 2>&1; then
            echo "runner 无 qemu-system-riscv32,尝试 apt 安装"
            sudo apt-get update 2>&1 | tail -3 || echo "(apt update 非零,用现有索引继续)"
            sudo NEEDRESTART_SUSPEND=1 apt-get install -y --no-install-recommends \
              qemu-system-misc 2>&1 | tail -3 || echo "(apt install 非零——postinst systemctl 在容器内失败,检查二进制)"
          fi
          command -v qemu-system-riscv32 || { echo "qemu-system-riscv32 不可用" >&2; exit 1; }
          # mdbook:cargo install(latest/download 资产名带版本前缀,wget 裸名
          # 404;cargo install 编译 ~2-3 分钟,换取不猜资产名)
          if ! command -v mdbook >/dev/null 2>&1; then
            cargo install mdbook --locked
          fi
          mdbook --version
          qemu-system-riscv32 --version | head -1

      - name: 主门禁(book/ci/check.sh 五步)
        run: bash book/ci/check.sh
