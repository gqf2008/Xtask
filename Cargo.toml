[package]
authors = ["高庆丰 <gao.qingfeng@gmail.com>"]
categories = ["embedded", "rtos", "no-std"]
description = "嵌入式多任务调度系统"
edition = "2021"
keywords = ["arm", "riscv", "riscv64", "cortex-m", "cortex-r", "cortex-a", "gd32", "stm32", "ch32", "esp"]
license = "MIT"
name = "xtask"
repository = "https://github.com/gqf2008/xtask"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# 默认特征
default = ["xtask_executor", "xtask_scheduler","timer", "rtt_log"]
# 默认单硬件线程执行器
xtask_executor = []
# 打印任务清单任务
debug_task = []
# 软件定时器
timer = []
# 默认调度器
xtask_scheduler = []
# 芯片支持
# rp2040
# rp2040(2026-08-23 复活):曾经的阻断是 rp2040-hal 0.5.0 依赖被 yank 的
# critical-section 0.2.x;0.9 起已换 1.x,现用 0.12。BSP 用仓库自带的
# bsp_pins!(bsp/rp_pico/mod.rs),不依赖 rp-pico 官方 BSP crate。
rp2040 = ["rp2040-hal", "rp2040-boot2"]
# gd32vf103
gd32vf103 = ["gd32vf103xx-hal", "longan_nano", "riscv-rt"]
# stm32f1xx
stm32f1 = ["stm32f1xx-hal", "bluepill"]
# stm32f4xx
stm32f4 = ["stm32f4xx-hal", "greenpill"]
# stm32h7xx
stm32h7 = ["stm32h7xx-hal"]
# cm32m4
cm32m4=["riscv-rt"]  # 空依赖激活:chip 代码用内嵌 ECLIC 抽象,不需要 HAL(示例纯内核 API)

# 板级支持包
# longan_nano
longan_nano = ["st7735-lcd", "mpu6050"]
# bluepill stm32f103
bluepill = []
# greenpill stm32f401ccu6
greenpill = []
# rtt_log
rtt_log = []
#stdout_log
stdout_log = []
#fatfs
fs=["fatfs"]
#usb 协议栈(第 23 章):协议在第三方 crate("协议是别家的,我们的活是搬字节"),
#芯片相关实现(Gd32UsbBus)在 chip/gd32vf103/usb.rs,经 #[cfg(all(usb, gd32vf103))] 合闸
usb=["usb-device","usbd-serial"]
# CH32 移植(ch32-rs PAC;构建级验证,纯内核示例;PAC 零 embedded-hal 依赖)
ch32v103 = ["ch32v1", "riscv-rt"]
esp32c3 = ["dep:esp32c3", "riscv-rt"]
ch32v203 = ["ch32v2", "riscv-rt"]
ch32v307 = ["ch32v3", "riscv-rt"]
#ble 蓝牙(第 24 章):协议栈在 E104-BT5032A 模组固件内——我们的活是
#AT 命令编解码 + GATT 服务建模,纯 Rust 零新依赖
ble=[]
#net
net=["smoltcp"]

[dependencies]
bare-metal = "1.0.0"
bit_field = "0.10.1"
crossbeam = {version = "0.8.1", default-features = false, features = ["alloc"]}
embedded-hal = "0.2.3"
heapless = "0.7"
# lazy_static = {version = "1.4.0", default-features = false, features = ["spin_no_std"]}
# default-features=false 去掉 spin 锁(thumbv6m 无原子 CAS,spinning_top 编不过);
# 全局堆由 XTaskAllocer(本内核临界区保护)接管——单核语义不变
linked_list_allocator = {version = "0.10.3", default-features = false}
nb = "1.0.0"
profont = "0.4.0"
# spin = "0.9.3"
cast = {version = "0.3.0", default-features = false}
log = "0.4.17"
# panic-probe = {version = "0.3", features = ["print-rtt"]}
cty = "0.2.2"
vcell="0.1.3"
anyhow = {version = "1.0.62", default-features = false}
atomic-polyfill = "1.0.1"

# optional
fatfs = { git = "https://github.com/rafalh/rust-fatfs",optional = true,  features = ["unicode","alloc","lfn"], default-features = false }
# CH32 系列 PAC(ch32-rs;QingKe 内核 PFIC/SysTick 模型,依赖仅 riscv/vcell)
ch32v1 = {version = "0.1.6", optional = true, features = ["ch32v103"]}
ch32v2 = {version = "0.1.6", optional = true, features = ["ch32v20x"]}
ch32v3 = {version = "0.1.6", optional = true, features = ["ch32v30x"]}
# ESP32-C3 PAC(独立于 esp32c3-hal——HAL 版本图冲突,PAC 直依赖路线)
esp32c3 = {version = "0.3", optional = true}
gd32vf103xx-hal = {path = "hal2/gd32vf103xx-hal", optional = true}
mpu6050 = {version = "0.1.4", optional = true}
rp2040-boot2 = {version = "0.3", optional = true}
rp2040-hal = {version = "0.9", optional = true}
st7735-lcd = {version = "0.8", optional = true}
stm32f1xx-hal = {version = "0.9.0", optional = true, features = ["rt", "stm32f103"]}
stm32f4xx-hal = {version = "0.13.2", optional = true, features = ["rt", "stm32f411"]}
stm32h7xx-hal = {version = "0.12.2", optional = true, features = ["rt", "stm32h7b0","log-rtt"]}
usb-device = { version = "0.3.2", optional = true }
usbd-serial = { version = "0.2.2", optional = true }
smoltcp = { version = "0.8.0", optional = true, default-features = false, features = ["alloc","proto-ipv4","medium-ip","socket-raw","socket-udp","socket-tcp","socket-icmp","socket-dhcpv4"] }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.4", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.1"
rtt-target = {version = "0.3.1", features = ["cortex-m"]}
panic-rtt-target = { version = "0.1.0", features = ["cortex-m"] }
panic-probe = {version = "0.3", features = ["print-rtt"]}

[target.'cfg(target_arch = "aarch64")'.dependencies]
cortex-a = "7.2.0"

[target.'cfg(all(any(target_arch = "riscv32",target_arch = "riscv64")))'.dependencies]
riscv = "0.8.0"
# riscv-rt optional 化:由各 riscv 芯片 feature 显式拉起——esp32c3 虽是 riscv32
# 但经 riscv-rt 直启(esp-riscv-rt 与它 _start 符号冲突,不用 esp 侧运行时)
riscv-rt = {version = "0.11.0", optional = true}
rtt-target = {version = "0.3.1", features = ["riscv"]}
panic-halt = "0.2.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14.9"

[dev-dependencies]
panic-halt = "0.2.0"

[profile.dev]
codegen-units = 1
debug = true
incremental = false
# thin 而非 fat：fat LTO 把全部 crate 合并成单一模块，其中 `.weak` 弱符号定义
# 与 `#[no_mangle]` 强定义并存时 rust-lld 报 "changed binding to STB_GLOBAL"，
# 应用层实现外设中断向量（port.S 的 `.weak USART0` + `#[no_mangle] fn USART0()`）
# 就无法链接；thin 每模块独立、符号解析正常。cortex-m-rt 的弱符号在 cc 编译的
# startup.o 里（不进 bitcode），所以它不受 fat LTO 影响——这是本项目特有的坑。
lto = "thin"
opt-level = "z"

[profile.release]
codegen-units = 1
debug = true
lto = "thin"
# strip = true
opt-level = "z"
