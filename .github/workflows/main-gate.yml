name: main-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + 目标
        uses: dtolnay/rust-toolchain@nightly
        with:
          # checkpoint 目标集:riscv32imac(gd32/qemu 全链) + thumbv7em(ch16
          # checkpoint);host 测试与 [3/5] 示例链接共用 riscv32imac
          targets: riscv32imac-unknown-none-elf, thumbv7em-none-eabihf

      - name: 安装 QEMU(riscv32)与 mdbook
        run: |
          sudo apt-get update
          # riscv32 系统模拟器在 qemu-system-misc;其 postinst 的 systemctl
          # 在 runner 容器里失败会让 apt 返回 8,但包本身已装好——
          # 容忍退出码并以二进制存在性为判据
          sudo NEEDRESTART_SUSPEND=1 apt-get install -y --no-install-recommends qemu-system-misc \
            || true
          command -v qemu-system-riscv32 || { echo "qemu-system-riscv32 未装上" >&2; exit 1; }
          # mdbook 用官方 release 二进制(避免 cargo install 编译数分钟)
          wget -q https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook-x86_64-unknown-linux-gnu.tar.gz
          sudo mv mdbook /usr/local/bin/
          mdbook --version
          qemu-system-riscv32 --version | head -1

      - name: 主门禁(book/ci/check.sh 五步)
        run: bash book/ci/check.sh
