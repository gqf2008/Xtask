name: r52-qemu

on:
  push:
    branches: [master]
  pull_request:

jobs:
  r52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + armv7r target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: armv7r-none-eabi

      - name: 构建补丁版 QEMU(上游 GIC CPU 接口地址重叠 bug,IRQ 永不投递)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 gcc libglib2.0-dev libpixman-1-dev flex bison
          wget -q https://download.qemu.org/qemu-11.1.0.tar.xz
          tar xf qemu-11.1.0.tar.xz
          cd qemu-11.1.0
          patch -p1 < "$GITHUB_WORKSPACE/book/ci/qemu-gic-r52.patch"
          ./configure --target-list=aarch64-softmmu \
            --disable-werror --disable-docs --disable-tools \
            --disable-guest-agent --disable-gnutls --disable-nettle \
            --disable-gcrypt --disable-vnc --disable-vnc-jpeg --disable-vnc-png \
            --disable-vhost-net --disable-vhost-user --disable-debug-info
          make -j"$(nproc)"

      - name: R5 执行级门禁(乒乓 + VFP 帧)
        env:
          QEMU_R52_BIN: qemu-11.1.0/build/qemu-system-aarch64
        run: bash book/ci/check_r52.sh
