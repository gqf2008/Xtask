name: r52-qemu

on:
  push:
    branches: [master]
  pull_request:

jobs:
  r52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + armv7r target
        # toolchain 参数 pin:根 rust-toolchain 已固定 nightly-2025-08-08,
        # targets 必须装进同一工具链(否则 E0463 找不到 core)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-08
          targets: armv7r-none-eabi

      - name: 构建补丁版 QEMU(上游 GIC CPU 接口地址重叠 bug,IRQ 永不投递)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 gcc libglib2.0-dev libpixman-1-dev flex bison
          wget -q https://download.qemu.org/qemu-11.1.0.tar.xz
          tar xf qemu-11.1.0.tar.xz
          cd qemu-11.1.0
          patch -p1 < "$GITHUB_WORKSPACE/book/ci/qemu-gic-r52.patch"
          # 只留核心参数:其余 disable 选项在 release 与 GitHub 源码间
          # 不一致(本地构建的 configure 参数列表比 release 多),QEMU
          # configure 对缺失依赖自动禁用,无需逐个 --disable
          ./configure --target-list=aarch64-softmmu --disable-werror
          make -j"$(nproc)"

      - name: R5 执行级门禁(乒乓 + VFP 帧)
        env:
          QEMU_R52_BIN: qemu-11.1.0/build/qemu-system-aarch64
        run: bash book/ci/check_r52.sh
